# whole automation
name: Run Tests

# Trigger (on:) — what causes the workflow to run: a push, a pull request, a schedule, manually
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Job — one unit of work, run on its own fresh machine
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'

      - name: Install dependencies
        run: npm install
        working-directory: server

      - name: Run tests
        run: npm test
        working-directory: server
